[project]
name = "coversml"
version = "0.1.0"
description = "Telling cover songs from originals with lyric embeddings and catalogue metadata"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "catboost>=1.2.7",
    "scipy>=1.14",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.4"]
explain = ["shap>=0.46"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coversml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/plots/*" = ["E501", "E702"]
